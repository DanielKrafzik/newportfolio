<div *ngIf="currentProject" class="project-detail-container">

  <a id="go-back-btn" href="#projects"><img src="/img/back_arrow.png" alt=""><p>Go Back</p></a>

  <div class="project-detail-content">
    <div class="project-detail-description">
      <div>
        <h1>{{ currentProject.title }}</h1>
        <img src="/img/line_aboutme.png" alt="">
      </div>
        <h2>Description</h2>
        <p>{{ currentProject.description }}</p>
        <h2>Implementation Details</h2>
        <p>{{ currentProject.workflow }}</p>
        <p><span id="span-duration">Duration:</span> 5 weeks</p>
        <div class="tech-div">
            <span *ngFor="let tech of currentProject.technologies">{{ tech }}</span>
        </div>
    </div>

    <div class="project-detail-media">
        <img [src]="currentProject.image">
        <div class="detail-btn-div">
            <a href="{{ currentProject.github }}" class="detail-btn" target="_blank">GitHub</a>
            <a href="" class="detail-btn">Live Test</a>
        </div>

    </div>

  </div>

  <a id="next-btn" [routerLink]="['/portfolio', currentProject.next]"><p>Next Project</p> <img src="/img/next_arrow.png" alt=""></a>

</div>
